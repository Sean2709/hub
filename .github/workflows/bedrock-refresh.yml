name: Refresh Bedrock data

# Daily re-query of the Bedrock catalog → commit public/data/bedrock/* → redeploy Pages.
# Credentials: GitHub OIDC → IAM role (read-only: bedrock:ListFoundationModels, bedrock:ListInferenceProfiles).
# The role ARN lives in the repository variable AWS_ROLE_ARN (Settings → Secrets and variables → Actions → Variables).

on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 KST daily
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed data
  id-token: write   # OIDC to AWS
  actions: write    # dispatch pages.yml (pushes by GITHUB_TOKEN don't trigger `on: push`)

concurrency:
  group: bedrock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: hub-bedrock-refresh

      - name: Generate data (aws CLI is preinstalled on ubuntu runners; no pip needed)
        run: python3 scripts/gen_bedrock.py

      # Public, unauthenticated Price List bulk API (no IAM needed). A price-fetch failure must not
      # block the catalog refresh — the previous pricing.json is kept (the script refuses to write empty data).
      - name: Generate prices
        continue-on-error: true
        run: python3 scripts/gen_bedrock_pricing.py

      - name: Commit if changed
        id: commit
        run: |
          git add public/data/bedrock
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name  "hub-bot"
          git config user.email "hub-bot@users.noreply.github.com"
          # meta.json always changes (checked_at); mention real catalog changes in the subject when present
          if git diff --cached --name-only | grep -q 'changes.json'; then
            subj="data: bedrock catalog changed $(date -u +%F)"
          else
            subj="data: bedrock checked $(date -u +%F)"
          fi
          if git diff --cached --name-only | grep -q 'pricing.json'; then
            subj="$subj (+prices)"
          fi
          git commit -m "$subj" -m "generated by .github/workflows/bedrock-refresh.yml"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Redeploy Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
